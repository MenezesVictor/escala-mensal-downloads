name: Autorizar atualizações Windows e Mac
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency: manifesto-estavel
jobs:
  manifesto:
    if: github.repository == 'MenezesVictor/escala-mensal-downloads' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Registrar o hash em um commit assinado pelo GitHub
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/latest" > release.json
          python3 - <<'PY'
          import json, re, pathlib
          r=json.load(open('release.json'));tag=r['tag_name']
          assert not r['draft'] and not r['prerelease'] and re.fullmatch(r'v[0-9]+\.[0-9]+(?:\.[0-9]+)?',tag)
          lines=[]
          for suffix in ('Atualizacao','Mac_Apple_Silicon'):
              name=f'EscalaMensal_{tag[1:]}_{suffix}.zip'
              asset,=[a for a in r['assets'] if a['name']==name and a['state']=='uploaded']
              digest=asset['digest']
              assert re.fullmatch('sha256:[0-9a-f]{64}',digest)
              lines.append(f'{digest[7:]}  {name}')
          pathlib.Path('SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          PY
          head=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          query='mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}'
          jq -n --arg q "$query" --arg repo "$REPO" --arg head "$head" --arg content "$(base64 -w0 SHA256SUMS.txt)" '{query:$q,variables:{input:{branch:{repositoryNameWithOwner:$repo,branchName:"main"},message:{headline:"Autoriza atualização estável do Escala Mensal"},expectedHeadOid:$head,fileChanges:{additions:[{path:"SHA256SUMS.txt",contents:$content}]}}}}' > commit.json
          sha=$(gh api graphql --input commit.json --jq .data.createCommitOnBranch.commit.oid)
          test "$(gh api "repos/$REPO/commits/$sha" --jq '.commit.verification.verified')" = true
